name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Mamba Environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: workflow/envs/environment.yaml
          environment-name: nematree
          cache-environment: true

      - name: Install Snakemake
        shell: bash -l {0}
        run: |
          micromamba activate nematree
          pip install snakemake

      - name: Run Snakemake Integration Test
        shell: bash -l {0}
        run: |
          micromamba activate nematree
          snakemake --directory .tests/integration --snakefile workflow/Snakefile --cores 3 --show-failed-logs --all-temp