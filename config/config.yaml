# ==================================================
#               NemaTree: CONFIGFILE
# ==================================================
# this file should be edited by the user to configure the analysis

conda: "../workflow/envs/environment.yaml"  # leave this unedited

# ==================================
# Sequences to add (REQUIRED)
# ==================================
# specify a name: "filepath" pair
samples:
  SSUtestadd: "resources/samples/SSUtestadd.fasta"

# option to set a minimum sequence length for sequences you are adding
enforce_minlength: False # options are True or False
min_seq_length: 500

# ==================================
# Reference alignment (CHOOSE)
# ==================================

# (1) Choose locus to analyse: "SSU" or "LSU"
locus: "SSU"

# (2) Choose scope of the reference library: "genus" or "clades123"
scope: "genus"

# Reference alignments for each locus/scope combination
# only edit if you have changed these
reference_alignments:
  SSU:
    genus: "resources/reference/SSU_genus_ref156.fas"
    clades123: "resources/reference/SSU_clades123_genus156.fas"
  LSU:
    genus: "resources/reference/LSU_genus_ref5.fasta"
    clades123: "resources/reference/LSU_clades123_ref5.fasta"


# ==================================
# Alignment quality control
# ==================================

# Sequence plots
# ---------------------------------
# Generate sequence plots, supressing this will save some time
# alnseqlength_histogram, length_histogram, mafft_cialign_output
generate_seq_plots: False

# CIAlign
# ---------------------------------
cialign_len_filter: False # Filter short sequences from alignment
cialign_minlen: 400 # minimum sequence length (bp)

# True requires a list of sequences to keep whatever their length
# False will make no special cases and filter by length specified above
retain_short_list_seqs: False
cialign_retain_short_list: "config/retain_short.txt"

# =============
# Phylogenetics
# =============

# IQtree substitution models
# --------------------------
subst_models: 
  SSU: "GTR+R3"
  LSU: "TIM3+F+G4"
# SSU best-fit by BIC is GTR+R3 but GTR+I+G usually fine also.
# LSU, Best-fit by BIC AIC is TIM3+F+G4 but GTR+I+G usually fine also.


# Rooting the phylogenetic tree (in toytree)
# ------------------------------------------
# =====================
# CHOICE REQUIRED HERE
# =====================
# Rooting method: choose one of "outgroup", "outgroup_list", "midpoint", "mad"
rooting:
  method: "outgroup"

# Recommendations:
# ----------------
# | Scope       | Method        | Taxa                                 |
# | ----------- | ------------- | ------------------------------------ |
# | genus       | outgroup      | outgroup_name: "Pratylenchus"        |
# | clades123   | outgroup_list | list chosen automatically per locus  |

  # Used when method == "outgroup"
  outgroup_name: "Pratylenchus"

  # Root on the ancestral node of these taxa (exact names).
  # The list matching the chosen SSU/LSU locus is picked automatically.
  outgroup_lists:
    SSU:
      - "M_artiellia_AF442192"
      - "M_artiellia_KC875391"
      - "M_baetica_KP896296"
      - "M_baetica_MH011982"
    LSU:
      - "M_artiellia_LSU_AY150369"
      - "M_artiellia_KY433426"
      - "M_baetica_LSU_AY150367"
      - "M_baetica_LSU_MH011971"


# Colouring and labelling of tip names
# ------------------------------------
# basic tree tip settings
toytree_tipsize: 6
toytree_tipcolor: "#52373A"
toytree_tipmarker: "o"

# font size for tip labels, 12 is standard.
font_size: 12

# Formatting for newly added sequences in tree plots
format_added_seqs: True   # highlight added tips with a symbol + colour

added_sequence_style:
  marker: "▲ "      # prefix shown before newly added tip names
  color: "red"      # colour used for newly added tip names

# Species name coloring TRUE/FALSE
# FALSE is all black names with red for added seqs
color_by_species: TRUE

# Mapping of species names to colours
