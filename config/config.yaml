# ==================================================
#               RKN-rRNA: CONFIGFILE
# ==================================================
conda: "../envs/environment.yaml"  # leave this unedited

my_experiment: "RKN_test"  # the experiment name, no_spaces

samples: "config/samples.tsv"  # location and name of sample list

input_data: "resources/samples"  # directory of sample files for analysis
molecule_type: "RNA"  # RNA or DNA

min_seq_length: 3000

exclude_seqs: "TRUE"  # TRUE or FALSE, remove seqs based on text file list
# list of excluded seqs, 1 per line, fasta header line minus >
exclusion_list: "config/excluded.txt"
