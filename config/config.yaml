# ==================================================
#               RKN-rRNA: CONFIGFILE
# ==================================================
# this file should be edited by the user to configure the analysis
# ==================================================
conda: "../envs/environment.yaml"  # leave this unedited

# -------------------------------
# Experimental details for report
# -------------------------------
# Add a report title, reflecting the experiment
# expt_title: "RKN_test"

# Add a description to the report
# expt_description: "Testing the addition of typical RKN species"

# -------------------------------
# Your sequences to add (REQUIRED)
# --------------------------------
# add sequences to the reference alignment?
add_sequences: TRUE # FALSE will build a phylogeny of reference sequences only
# give fasta "basename" in resources/samples/basename.fas WITHOUT the .fas extension
seqs_to_add: "3testadd3"

#  build a tree from the reference alignment only
#  change "add_sequences: FALSE" above
ref_only: FALSE # TRUE if phylogeny of only reference alignment is required

# use qc.smk minlength rule to enforce a minimum sequence length
# min_seq_length: 3000

# -------------------------------
# Reference alignment
# --------------------------------
# TRUE if ref alignment of only RKN clades 1,2 and 3 are 
# to be used rather than all spp. in the genus. FALSE = genus
clades123: TRUE 
# reference alignment clades 123 to which samples are added WITHOUT .fas file extension
reference_alignment_clades123: "genus_ref148clades_arti"

# Genus reference alignment
# reference alignment to which samples are added WITHOUT .fas file extension
reference_alignment: "genus_ref148"

# NEEDS TO BE FIXED
# filter taxa from reference alignment
exclude_seqs: False  # TRUE or FALSE, remove seqs based on text file list
# list of excluded seqs, 1 per line, fasta header line minus >
exclusion_list: "config/nonclade123.txt"
filtered_ref_alignment: "reference_filtered"

# Generate sequence plots, supressing this will save some time
# alnseqlength_histogram, length_histogram, mafft_cialign_output
generate_seq_plots: False

# CIAlign
# list of sequences to keep despite length filtering
retain_short_list: "config/retain_short_list.txt"
# minimum sequence length (bp)
cialign_minlen: "750"

# IQtree substitution model
subst_model: "GTR+R3" # Best-fit by BIC. GTR+I+G usually fine also.

# Tree rooting, only one of these should be True
# recommendation: 
  # whole genus use: outgroup_name: "Pratylenchus"
  # clades 123 use: outgroup_list_names: M. aretiellia and M. baetica
rooting:
  outgroup_root: False
  outgroup_name: "Pratylenchus"
  outgroup_list: True
  outgroup_list_names: # root on ancestral node of these taxa, exact names should be used
    - "M_artiellia_AF442192"
    - "M_artiellia_KC875391"
    - "M_baetica_KP896296"
    - "M_baetica_MH011982"
  midpoint_root: False
  mad_root: False

#  add icons to added sequence names
add_treename_icons: True

# colour names of species
species_colours: True

# select graphic formats to save final treefile, default html
tree_formats:
  - "html"
  # - "png"
  # - "pdf"
  # - "svg"