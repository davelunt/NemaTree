# ==================================================
#               NemaTree: CONFIGFILE
# ==================================================
# this file should be edited by the user to configure the analysis
# ==================================================
conda: "../workflow/envs/environment.yaml"  # leave this unedited

# -------------------------------
# Sequences to add (REQUIRED)
# --------------------------------
# specify a name: "filepath" pair
samples:
  SSUunknowns: "resources/samples/unknown.fasta"

# option to set a minimum sequence length for sequences you are adding
enforce_minlength: False
min_seq_length: 500

# -------------------------------
# Reference alignment
# --------------------------------
# TRUE if ref alignment of only RKN clades 1,2 and 3 are 
# to be used rather than all spp. in the genus. FALSE = genus
clades123: False 

# Clades 1, 2 and 3 reference alignment (if required)
reference_alignment_clades123: "resources/reference/SSU_clades123_genus156.fas"
# reference_alignment_clades123: "resources/reference/LSUref5clade123.fasta"


# Genus reference alignment (if required)
# path to genus reference alignment to which samples are added
reference_alignment: "resources/reference/SSU_genus_ref156.fas"
# reference_alignment: "resources/reference/LSUref5.fasta"
# ---------------------------------

# Generate sequence plots, supressing this will save some time
# alnseqlength_histogram, length_histogram, mafft_cialign_output
generate_seq_plots: False

# ==================================
# CIAlign alignment quality control
# ==================================

cialign_len_filter: False # Filter short sequences from alignment
cialign_minlen: 400 # minimum sequence length (bp)

# True requires a list of sequences to keep whatever their length
# False will make no special cases and filter by length specified above
retain_short_list_seqs: False
cialign_retain_short_list: "config/retain_short.txt"

# =============
# Phylogenetics
# =============

# IQtree substitution model
# -------------------------
subst_model: "GTR+R3" 
# SSU best-fit by BIC is GTR+R3 but GTR+I+G usually fine also.
# LSU, Best-fit by BIC AIC is TIM3+F+G4 but GTR+I+G usually fine also.

# Rooting the phylogenetic tree (in toytree)
# ------------------------------------------
# only one of these below should be True
# recommendation: 
  # whole genus use: outgroup_name: "Pratylenchus"
  # clades 123 use: outgroup_list_names: M. aretiellia and M. baetica (see below)
rooting:
  outgroup_root: True
  outgroup_name: "Pratylenchus"
  outgroup_list: False
  outgroup_list_names: # root on ancestral node of these taxa, exact names should be used
  # SSU sequences
    # - "M_artiellia_AF442192"
    # - "M_artiellia_KC875391"
    # - "M_baetica_KP896296"
    # - "M_baetica_MH011982"
  # LSU sequences
    - "M_artiellia_LSU_AY150369"
    - "M_artiellia_KY433426"
    - "M_baetica_LSU_AY150367"
    - "M_baetica_LSU_MH011971"
  midpoint_root: False
  mad_root: False

# Colouring and labelling of tip names
# ------------------------------------

# basic tree tip settings
toytree_tipsize: 6
toytree_tipcolor: "#52373A"
toytree_tipmarker: "o"

# add (triangle) icons to added sequence names
add_treename_icons: True

# Species name coloring TRUE/FALSE
# FALSE is all black names with red for added seqs
color_by_species: TRUE

# Mapping of species names to colours
