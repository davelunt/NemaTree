# ===================
# Saving the treefile
# ===================

# toytree image sizes
toytree_width: 800
toytree_height: 1800
toytree_node_sizes: 3

# select graphic formats to save final treefile
tree_formats:
  - "html"
  # - "png"
  # - "pdf"
  # - "svg"